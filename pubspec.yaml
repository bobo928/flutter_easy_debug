name: easy_debug
description: An in-app Flutter debugger for Dio and http, with bounded logs, request inspection, environment switching and a floating console.
version: 0.0.4
# homepage: https://www.example.com
repository: https://github.com/bobo928/flutter_easy_debug

environment:
  sdk: ^3.10.1
  flutter: '>=3.3.0'

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
